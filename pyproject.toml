[project]
name = "documind"
version = "0.1.0"
description = "DocuMind native PDF ingestion and source preview"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<2.1", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2",
  "celery[redis]>=5.4,<6", "pymupdf>=1.25,<2",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
ocr = [
    "paddleocr==3.7.0",
    "paddlepaddle==3.3.1 ; (platform_machine == 'x86_64' and sys_platform == 'linux') or sys_platform == 'darwin'",
]
[dependency-groups]
dev = ["pytest>=8,<9", "httpx>=0.28,<1", "ruff>=0.11,<1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["backend/documind"]
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
markers = ["integration: requires local PostgreSQL and Redis services", "ocr: requires the locked OCR extra and verified model artifacts"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]
